<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SweetTalk</title><style>body{font:16px/1.8 system-ui;padding:24px;max-width:760px;margin:auto;overflow-wrap:anywhere}a,select{padding:8px}p{margin:16px 0}</style><a id="back" href="/">SweetTalk</a><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option></select><main id="content"></main><footer><a href="mailto:outintube@gmail.com">outintube@gmail.com</a><br><a href="https://www.cloudflare.com/privacypolicy/">Cloudflare</a> · <a href="https://cdn.deepseek.com/policies/en-US/deepseek-open-platform-terms-of-service.html">DeepSeek API terms</a> · <a href="https://cdn.deepseek.com/policies/en-US/deepseek-privacy-policy.html">DeepSeek policy</a></footer><script>const data={"ko": ["SweetTalk 지원 및 신고", "이메일: outintube@gmail.com. 메일 앱이 없다면 웹메일에서 이 주소로 직접 문의하세요. 문제 유형과 필요한 응답만 보내고 개인정보는 제외하세요."], "en": ["SweetTalk Support and Reports", "Email: outintube@gmail.com. Without an email app, use your webmail to contact this address. Include the concern and only the relevant response; omit personal information."], "ja": ["SweetTalk サポート・報告", "メール：outintube@gmail.com。メールアプリがない場合はウェブメールから送信できます。問題の内容と必要な応答のみを送り、個人情報は除いてください。"], "zh-CN": ["SweetTalk 支持与举报", "邮箱：outintube@gmail.com。没有邮件应用时可通过网页邮箱联系此地址。仅提供问题及相关回复，请勿包含个人信息。"]}; const select=document.getElementById('language');let lang='ko';try{lang=localStorage.getItem('sweettalk:language')||'ko'}catch{}if(!data[lang])lang='ko';select.value=lang;function render(){document.documentElement.lang=select.value;const root=document.getElementById('content');root.replaceChildren();data[select.value].forEach((text,i)=>{const el=document.createElement(i?'p':'h1');el.textContent=text;root.append(el)})}select.onchange=()=>{try{localStorage.setItem('sweettalk:language',select.value)}catch{}render()};render();</script></html>
