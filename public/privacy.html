<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SweetTalk</title><style>body{font:16px/1.8 system-ui;padding:24px;max-width:760px;margin:auto;overflow-wrap:anywhere}a,select{padding:8px}p{margin:16px 0}</style><a id="back" href="/">SweetTalk</a><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option></select><main id="content"></main><footer><a href="mailto:outintube@gmail.com">outintube@gmail.com</a><br><a href="https://www.cloudflare.com/privacypolicy/">Cloudflare</a> · <a href="https://cdn.deepseek.com/policies/en-US/deepseek-open-platform-terms-of-service.html">DeepSeek API terms</a> · <a href="https://cdn.deepseek.com/policies/en-US/deepseek-privacy-policy.html">DeepSeek policy</a></footer><script>const data={"ko": ["SweetTalk 개인정보 처리방침", "시행일: 2026-10-15. 문의: outintube@gmail.com", "계정·광고·추적 기능이 없습니다. 캐릭터 설정, 대화, 번역 캐시, 입력 지역, 언어 및 알림 설정은 기기에 저장합니다. 대화 기록을 개발자 서버 데이터베이스에 저장하는 기능은 없습니다.", "명시적 동의 후 대화·캐릭터 설정·AI 응답을 Cloudflare를 통해 DeepSeek API에 보내 응답 생성, 번역 및 입력·출력 안전 검사를 수행합니다. 거절한 경우 AI 기능을 사용할 수 없지만 설정·정책은 열 수 있습니다. 설정에서 동의를 철회할 수 있습니다.", "날씨는 기본적으로 꺼져 있습니다. 선택적으로 활성화한 경우 입력 지역을 wttr.in에 보내고, 지역과 날씨 맥락을 DeepSeek에 보냅니다. 정확한 GPS 위치는 요청하지 않습니다. 외부 서비스는 요청 처리 과정에서 IP를 받을 수 있습니다. Cloudflare 사용량 제한 KV가 활성화되면 IP 기반 요청 횟수를 약 24시간 동안 저장합니다.", "DeepSeek 일반 공개 정책은 개발자 API를 이용한 하위 앱의 개인정보 처리 규칙을 직접 설명하지 않습니다. 현재 API 데이터 보관 기간·처리 지역·학습 이용 제외를 확정하지 못했으며 무보관·학습 제외를 보장하지 않습니다. API 계약 조건을 확인하기 전에는 민감한 개인정보를 입력하지 마세요. 문의·삭제 요청은 운영자에게 보내면 관련 서비스 제공자에 협조를 요청합니다.", "대화·캐릭터 삭제와 첫 화면 설정의 모든 기기 데이터 삭제를 사용할 수 있습니다. 전체 삭제는 앱이 관리하는 로컬 기록·캐시·알림 예약을 제거하고 선택 언어만 유지합니다. 외부 서비스가 이미 처리한 데이터와 직접 내보낸 백업은 함께 삭제되지 않습니다. 백업은 저장 위치에서 별도로 삭제하세요. 알림은 기기에 예약되며, 신고 이메일은 사용자 이메일 앱에서 사용자가 직접 전송합니다."], "en": ["SweetTalk Privacy Policy", "Effective: October 15, 2026. Contact: outintube@gmail.com", "No account, ads or tracking. Characters, history, translation cache, entered area, language and reminder settings are stored on your device. The developer does not operate a conversation-history database.", "With explicit consent, messages, character settings and AI replies are sent through Cloudflare to the DeepSeek API for generation, translation and input/output safety checks. Without consent, AI features are unavailable; settings and policies remain accessible. Withdraw consent in settings.", "Weather is off by default. If enabled, your entered area is sent to wttr.in; the area and weather context are sent to DeepSeek. GPS permission is not requested. Providers may receive connection IP addresses. When enabled, Cloudflare rate-limit KV stores IP-based counts for approximately 24 hours.", "DeepSeek’s general policy does not directly specify downstream developer-app processing rules. API retention, processing region and exclusion from training are not confirmed. We do not guarantee zero retention or exclusion from training. Do not enter sensitive data. Contact the operator for privacy or deletion requests; the operator will request provider assistance where needed.", "Delete individual chats or characters, or use Delete all app data in home settings. Full deletion clears app-managed local history, cache and scheduled reminders, retaining the selected language. Previously processed provider data and exported backups are not deleted by this action. Delete backups separately. Reminders are local; report emails are sent by you through your email app."], "ja": ["SweetTalk プライバシーポリシー", "施行日：2026年10月15日。連絡先：outintube@gmail.com", "アカウント、広告、追跡機能はありません。キャラクター、履歴、翻訳キャッシュ、入力地域、言語と通知設定は端末に保存します。開発者は会話履歴データベースを運営していません。", "明示的な同意後、会話・キャラクター設定・AI応答をCloudflare経由でDeepSeek APIに送信し、生成・翻訳・入出力の安全検査を行います。同意しない場合AI機能は利用できませんが、設定とポリシーは閲覧できます。設定から同意を撤回できます。", "天気は初期設定で無効です。有効にすると入力地域をwttr.inに送信し、地域と天気の情報をDeepSeekに送信します。GPS権限は求めません。外部サービスは接続IPを取得する場合があります。利用制限KVが有効の場合、CloudflareはIP別の回数を約24時間保存します。", "DeepSeekの一般ポリシーは開発者のアプリにおける処理条件を直接定めていません。APIの保存期間・処理地域・学習利用除外は未確認であり、無保存や学習除外を保証しません。機密情報を入力しないでください。プライバシーや削除のご相談は運営者に連絡してください。必要に応じて提供者に協力を求めます。", "会話・キャラクターを削除するか、ホーム設定ですべてのアプリデータを削除できます。全削除はローカル履歴・キャッシュ・通知予約を消し、選択言語のみ保持します。外部で処理済みのデータと書き出したバックアップは同時に削除されません。バックアップは別途削除してください。通知は端末に予約し、報告メールはご自身のメールアプリから送信します。"], "zh-CN": ["SweetTalk 隐私政策", "生效日期：2026年10月15日。联系：outintube@gmail.com", "没有账户、广告或跟踪。角色、记录、翻译缓存、输入地区、语言和提醒设置保存在设备上。开发者不运营对话记录数据库。", "明确同意后，对话、角色设置和AI回复通过Cloudflare发送至DeepSeek API，用于生成、翻译及输入输出安全检查。不同意时无法使用AI功能，但仍可访问设置和政策。可在设置中撤回同意。", "天气默认关闭。启用后，输入地区会发送至wttr.in，地区和天气信息会发送至DeepSeek。不请求GPS权限。外部服务可能获取连接IP。启用限流KV时，Cloudflare按IP保存请求次数约24小时。", "DeepSeek的一般政策未直接规定开发者应用的处理条件。API保留期限、处理地区及训练排除尚未确认，不保证零保留或排除训练。请勿输入敏感信息。隐私及删除请求请联系运营者；必要时运营者会请求服务提供方协助。", "可删除对话或角色，或在首页设置中删除所有应用数据。全部删除会清除本地记录、缓存及提醒安排，仅保留所选语言。已由外部服务处理的数据及导出的备份不会一并删除。请另外删除备份。提醒在本地安排；举报邮件由您通过自己的邮件应用发送。"]}; const select=document.getElementById('language');let lang='ko';try{lang=localStorage.getItem('sweettalk:language')||'ko'}catch{}if(!data[lang])lang='ko';select.value=lang;function render(){document.documentElement.lang=select.value;const root=document.getElementById('content');root.replaceChildren();data[select.value].forEach((text,i)=>{const el=document.createElement(i?'p':'h1');el.textContent=text;root.append(el)})}select.onchange=()=>{try{localStorage.setItem('sweettalk:language',select.value)}catch{}render()};render();</script></html>
